project_id = "uvghvhcrovmuwivgijvl"

# Auth configuration, pushed to the linked project with `supabase config push`.
# Kept in the repo so the project's auth posture is reviewable in a diff rather
# than living only in a dashboard someone changed six months ago.
[auth]
enable_signup = true

# Anonymous sign-in stays OFF. It gave the best onboarding imaginable and no
# accountability whatsoever — a banned user reinstalled and was back in ten
# seconds with a fresh wallet, which made every control in migration 005
# decorative. See ADR-0004 for the full identity history.
enable_anonymous_sign_ins = false

# Nothing to link: the social account IS the account, not an upgrade to one.
enable_manual_linking = false

# Load-bearing, not optional — the OAuth session arrives through this deep link,
# and Supabase validates `redirect_to` against this list plus `site_url`. With the
# list empty, a successful Google consent redirects to `site_url` instead of the
# app: Google appears to work and the app never wakes up. That is exactly what was
# live on 2026-08-20 until it was caught by inspecting the authorize redirect.
#
# `site_url` is set to the same deep link rather than left at the 127.0.0.1
# placeholder, so the fallback lands somewhere useful too.
site_url = "companionchat://auth-callback"
additional_redirect_urls = ["companionchat://auth-callback"]

[auth.email]
# Off as a user-facing path. `enabled` stays true for exactly one reason:
# admin-created operational accounts. scripts/provider-console.mjs signs in as a
# real provider to test the two-sided conversation a single device cannot.
#
# `enable_signup = false` is what keeps it from being a public route — an
# operator can mint such an account, nobody else can. Kept deliberately (Amit,
# 2026-08-20); revisit before launch, because an auth path nobody uses is an
# attack surface nobody watches.
enabled = true
enable_signup = false
enable_confirmations = false

[auth.sms]
# Off. Phone + OTP was the strongest accountability available short of ID, and it
# was abandoned on cost: SMS is billed per message, and Indian transactional SMS
# additionally needs DLT registration (entity, header and template approval),
# which is weeks of lead time. Revisit when there is revenue to pay for it — the
# code for it is in git history, not deleted work.
enable_signup = false
enable_confirmations = false

# --- Turning it on later: the two routes, ready to uncomment -----------------
#
# The dashboard toggle is real and it is not the whole story. Supabase Auth
# implements phone login — OTP issue, verify, rate limits, session — but it has
# no carrier. Something has to actually put an SMS on the network, and that is
# where the two routes diverge. Costs are in ADR-0006 and were measured, not
# quoted: an Indian DLT aggregator is roughly 20x cheaper than Firebase Phone
# Auth for the same message.
#
# ROUTE A — a provider Supabase supports natively. MessageBird, Twilio, Vonage
# or TextLocal. Least code, most expensive (Twilio Verify lands near
# Rs 5,600/month at 1,300 OTPs against roughly Rs 385 for an aggregator):
#
#   enable_signup = true
#   [auth.sms.twilio]
#   enabled = true
#   account_sid = "env(TWILIO_ACCOUNT_SID)"
#   message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
#   auth_token = "env(TWILIO_AUTH_TOKEN)"
#
# ROUTE B — the Send SMS hook, which is what makes the cheap route possible.
# Supabase hands an Edge Function the user and the OTP and lets us deliver it
# however we like, so the carrier can be Msg91 or any Indian aggregator that is
# not on the supported-providers list. This is the route to take:
#
#   [auth.hook.send_sms]
#   enabled = true
#   uri = "https://<ref>.supabase.co/functions/v1/send-sms"
#   secrets = "env(SEND_SMS_HOOK_SECRET)"
#
# THE GATE IS NOT MONEY. Every domestic Indian SMS route requires DLT
# registration under the TRAI mandate — entity, then header (sender ID), then
# template — typically one to three weeks, and no vendor shortcuts it, Firebase
# included, because they all use the same domestic routes. So phone OTP is the
# slowest auth to launch in India, not the fastest, and turning either block on
# before DLT clears produces a sign-in screen that accepts a number and then
# fails. Start DLT in parallel; flip a block when the template is approved.

# ---------------------------------------------------------------------------
# Social identity — the only way in
# ---------------------------------------------------------------------------
# Both stay `enabled = false` in this file until real credentials exist, because
# a half-configured provider fails at the consent screen, in the browser, after
# the user has already left the app. Flip them in the dashboard once the secrets
# are set, or set them here through env() and push.
#
# Google:   console.cloud.google.com -> Credentials -> OAuth client (Web application)
#           Authorised redirect URI:
#             https://uvghvhcrovmuwivgijvl.supabase.co/auth/v1/callback
# Facebook: developers.facebook.com -> app -> Facebook Login -> Settings
#           Valid OAuth Redirect URI: the same URL.
#           Facebook additionally requires App Review for public use; test users
#           work immediately, real ones do not. Start review early.
#
# Instagram is absent because it does not exist as a provider — Meta shut the
# Instagram Basic Display API in Dec 2024 and Instagram sign-in now runs through
# Facebook Login for Business. See SocialProvider in src/api/auth.ts.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[auth.external.facebook]
enabled = false
client_id = "env(SUPABASE_AUTH_FACEBOOK_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_FACEBOOK_SECRET)"
redirect_uri = ""

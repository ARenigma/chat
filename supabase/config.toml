project_id = "uvghvhcrovmuwivgijvl"

# The admin control plane uses the service role and explicit `.schema('admin')`
# calls. RLS remains enabled with no anon/authenticated policies, so exposing
# the schema does not expose its rows to mobile clients.
[api]
schemas = ["public", "graphql_public", "admin"]
extra_search_path = ["public", "extensions"]

# Auth configuration, pushed to the linked project with `supabase config push`.
# Kept in the repo so the project's auth posture is reviewable in a diff rather
# than living only in a dashboard someone changed six months ago.
[auth]
enable_signup = true

# Anonymous sign-in stays OFF. It gave the best onboarding imaginable and no
# accountability whatsoever, a banned user reinstalled and was back in ten
# seconds with a fresh wallet, which made every control in migration 005
# decorative. See ADR-0004 for the full identity history.
enable_anonymous_sign_ins = false

# Nothing to link: the social account IS the account, not an upgrade to one.
enable_manual_linking = false

# Load-bearing, not optional, the OAuth session arrives through this deep link,
# and Supabase validates `redirect_to` against this list plus `site_url`. With the
# list empty, a successful Google consent redirects to `site_url` instead of the
# app: Google appears to work and the app never wakes up. That is exactly what was
# live on 2026-08-20 until it was caught by inspecting the authorize redirect.
#
# `site_url` is set to the same deep link rather than left at the 127.0.0.1
# placeholder, so the fallback lands somewhere useful too.
site_url = "companionchat://auth-callback"
additional_redirect_urls = [
  "companionchat://auth-callback",
  # Admin control plane OAuth callback — ADR-0023
  "https://admin.pappal.live/auth/callback",
]

[auth.email]
# Off as a user-facing path. `enabled` stays true for exactly one reason:
# admin-created operational accounts. scripts/provider-console.mjs signs in as a
# real provider to test the two-sided conversation a single device cannot.
#
# `enable_signup = false` is what keeps it from being a public route, an
# operator can mint such an account, nobody else can. Kept deliberately (Amit,
# 2026-08-20); revisit before launch, because an auth path nobody uses is an
# attack surface nobody watches.
enabled = true
enable_signup = false
enable_confirmations = false

[auth.sms]
# Still `enable_signup = false` until delivery is configured: see the block
# below. Everything else here is set now so that flipping one flag is the only
# remaining step.
#
# Enabled 2026-08-26, once the send-SMS hook below had both of its secrets.
#
# **Read this before running `supabase config push`.** That command sends this
# file verbatim AND resolves every `env(...)` from your local shell. Google
# sign-in went down on 2026-08-21 because it was pushed without
# `SUPABASE_AUTH_GOOGLE_SECRET` exported, so `[auth.external.google].secret` went
# up empty. The variable is deliberately NOT in `.env`. Export it from the OAuth
# client JSON in the same shell as the push, every time, or take Google down
# again — the failure is silent here and only shows up at the consent screen.
enable_signup = true
enable_confirmations = false

# Two minutes, not the fifteen a provider will offer by default.
#
# A code that lives for a quarter of an hour is a credential sitting in a
# notification shade on an unlocked phone. Two minutes is long enough to read six
# digits off a lock screen and short enough that a glanced-at code is useless by
# the time anyone acts on it.
#
# The honest cost, so it is a decision and not a surprise: Indian SMS delivery is
# usually a few seconds but can take thirty or more under load, and every second
# of that eats the window. If real users start reporting expired codes, this is
# the first number to look at, not the resend logic.
otp_expiry = 120

# Six digits. 10,000 combinations against even a two-minute window is not enough
# margin when the resend limit is the only other control.
otp_length = 6

# Matched deliberately to the 30-second countdown on the sign-in screen.
#
# Supabase's default is 60s, and leaving it there would have been a real bug: the
# UI enables "Resend code" at 30s, Supabase would reject the request, and the
# user would get a security error for pressing a button the app told them was
# ready. With a 120-second expiry a 60-second floor would also leave only one
# usable resend, which is not a recovery path.
max_frequency = "30s"

# --- The route chosen: Send SMS hook, WhatsApp Cloud API as carrier ---------
#
# **Carrier updated 2026-09-14.** The send-sms Edge Function now delivers the
# OTP via the Meta WhatsApp Cloud API (graph.facebook.com). WhatsApp does not
# let us author OTP copy: the code rides an approved AUTHENTICATION template
# with a copy-code button. Firebase phone auth is the SMS fallback when the
# recipient has no WhatsApp.
#
# ADR-0009 decided the hook approach over the old MSG91 OTP widget. The widget
# verified the code itself, taking Supabase Auth out of the login path entirely.
# The hook keeps Supabase Auth in charge and makes WhatsApp the carrier only.
#
# `supabase/functions/send-sms/index.ts` is written and deployed. Secrets it
# needs (verified with `supabase secrets list`):
#
#   SEND_SMS_HOOK_SECRET       the `v1,whsec_...` value shown for the hook
#   WHATSAPP_TOKEN             System User permanent token
#   WHATSAPP_PHONE_NUMBER_ID   the sending number's id
#   WHATSAPP_TEMPLATE_NAME     the approved AUTHENTICATION template name
#   WHATSAPP_LANG              template language code (default 'en')
#
# Enabled below. `enable_signup` for this channel is set once at the top of
# [auth.sms]; repeating it here is what made the whole file unparseable, because
# TOML rejects a key redefined inside the same table and the original commented
# block was written before that flag was flipped.
[auth.hook.send_sms]
enabled = true
uri = "https://uvghvhcrovmuwivgijvl.supabase.co/functions/v1/send-sms"
secrets = "env(SEND_SMS_HOOK_SECRET)"
#
# ON DLT: WhatsApp AUTHENTICATION templates are pre-approved by Meta and need
# no TRAI/DLT registration of our own. Android SMS Retriever autofill does not
# apply to WhatsApp delivery, so the code is typed; Firebase is the SMS fallback
# for recipients with no WhatsApp.

# ---------------------------------------------------------------------------
# Social identity, the only way in
# ---------------------------------------------------------------------------
# Stays `enabled = false` in this file until real credentials exist, because
# a half-configured provider fails at the consent screen, in the browser, after
# the user has already left the app. Flip them in the dashboard once the secrets
# are set, or set them here through env() and push.
#
# Google:   console.cloud.google.com -> Credentials -> OAuth client (Web application)
#           Authorised redirect URI:
#             https://uvghvhcrovmuwivgijvl.supabase.co/auth/v1/callback
#
# Google is the only provider. Facebook's block was deleted rather than left at
# `enabled = false`: ADR-0006 removed it from the app, and dead provider config
# is a standing invitation to re-enable something the sign-in screen no longer
# offers. Instagram never existed as a provider, Meta shut the Instagram Basic
# Display API in Dec 2024.
# DANGER, and it is not theoretical: `supabase config push` sends this block
# verbatim, so `enabled = false` here TURNS GOOGLE OFF on the live project even
# though the credentials were set in the dashboard. That is exactly what happened
# on 2026-08-21, a push made to change the SMS OTP expiry took Google sign-in
# down with it, because this file said false and the dashboard said true.
#
# The rule that follows: this file is authoritative or it is a landmine. There is
# no third state. So `enabled` is true, the client id is the literal (a client id
# is not a secret, it ships in google-services.json), and only the secret comes
# from the environment.
#
# A test in __tests__/contract.test.ts now fails if a provider the sign-in screen
# offers is declared disabled here.
[auth.external.google]
enabled = true
client_id = "305484620007-qt4tbvd29i5vl6qj34t0vboqvcmjrh73.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false

# Cashfree (and other vendor) webhooks authenticate with their own HMAC, not a
# Supabase user JWT. Leaving verify_jwt on returns 401 before our handler runs.
[functions.cashfree-webhook]
verify_jwt = false

# Auth SMS hook — signed with Standard Webhooks, not a user JWT.
[functions.send-sms]
verify_jwt = false


project_id = "uvghvhcrovmuwivgijvl"

# Auth configuration, pushed to the linked project with `supabase config push`.
# Kept in the repo so the project's auth posture is reviewable in a diff rather
# than living only in a dashboard someone changed six months ago.
[auth]
enable_signup = true

# Anonymous sign-in is OFF, and that is the whole of migration 006's first
# decision. It cost the product its sharpest feature — a usable session on the
# first frame — and bought the only thing that makes suspension, bans and report
# history mean anything: an identity that survives a reinstall. Against anonymous
# rows, every safety control shipped in 005 was theatre.
enable_anonymous_sign_ins = false

# Nothing left to link. The phone number IS the account, not an upgrade to it.
enable_manual_linking = false

additional_redirect_urls = []

[auth.email]
# Off as a user-facing path: members and providers both sign in by phone.
#
# `enabled` stays true for ONE reason: admin-created operational accounts.
# scripts/provider-console.mjs signs in as a real provider to test the two-sided
# conversation a single device cannot, and an OTP it cannot receive would make
# that impossible. `enable_signup = false` is what keeps it from being a public
# route — an operator can mint such an account, nobody else can.
#
# BEFORE LAUNCH: decide whether that account still needs to exist. An email path
# nobody uses is an attack surface nobody watches.
enabled = true
enable_signup = false
enable_confirmations = false

[auth.sms]
# The only onboarding path there is.
enable_signup = true
enable_confirmations = true
# 6 digits, and short-lived: an OTP is a bearer token for a whole account.
otp_length = 6
otp_expiry = 600

# REQUIRED BEFORE PHONE AUTH WORKS AT ALL.
#
# Supabase hosted does not send SMS itself; it needs a gateway. Until one is
# configured, `signInWithOtp` fails and there is no way into the app. Uncomment
# the provider you choose and set the secrets in the dashboard, not here.
#
# For the India launch market there is a second requirement that is not a
# Supabase setting: transactional SMS needs DLT registration (entity + header +
# template approval through the operator portal). That takes days to weeks, so it
# is the long-lead item on the critical path — start it before the code is ready,
# not after.
#
# [auth.sms.twilio]
# enabled = true
# account_sid = "env(TWILIO_ACCOUNT_SID)"
# message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
# auth_token = "env(TWILIO_AUTH_TOKEN)"

# Test numbers, so the device journeys and a reviewer can sign in without an SMS
# gateway or a real handset. These bypass the gateway entirely and return a fixed
# code — which is exactly why they must never be a real number.
#
# Digits only, no leading '+': the API serialises this table to
# `number=code,number=code` and rejects anything else.
[auth.sms.test_otp]
"919999900001" = "123456"
"919999900002" = "654321"

# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=true

# The version users see, and the one thing here a human edits per release.
#
# Deliberately a property rather than a literal in build.gradle: it is bumped on
# every internal build so testers can see 1.0.1 -> 1.0.2 in the update prompt,
# and a one-line diff is a better record of that than an edit buried in a
# 200-line gradle file. `npm run version:bump` moves the patch digit.
#
# versionCode is NOT here. It is derived for internal builds and required
# explicitly for release builds. See the comment above `ciBuildNumber`.
#
# 1.1.0 (2026-09-06) is a minor, not a patch: the seventeen-item roadmap landed
# behind it — GST disclosure, the usage ledger, chat-open alerts, the countdown
# and exit interlock, provider channels, stage names, the type tabs, ratings and
# session feedback, real photos, filters, the chat ring, and the permissions
# screen. It also REPAIRS A DRIFT. Internal builds are supposed to derive their
# code from this name (1.0.45 -> 10045), but hand-passed `-PversionCode` values
# had run ahead to 10056, so every derived build was a silent downgrade that
# adb would refuse. 1.1.0 -> 1*10000 + 1*100 + 0 = 10100 puts the derivation
# back in front, and the override is no longer needed.
#
# 1.1.1 is the first internal build carrying the motion-plan workstreams
# (W0-W6). Verified on the artefact rather than computed here: aapt2 badging
# reports versionCode 10101, versionName 1.1.1.
# 1.1.19 (2026-09-12) is a HOTFIX over 1.1.18, which crashed on every onboarding
# launch: `cometFade` in lib/nightSky.ts ran inside a UI-runtime worklet without
# the `'worklet'` directive. Found on the S22 the morning after 10122 went to
# alpha; guarded mechanically in __tests__/platform.test.ts from this build on.
#
# 1.2.0 (2026-09-13) carries the 21-item roadmap: delete account for real users,
# card payment fix (NFC permission restored), 50% first-recharge discount,
# edit/delete messages, provider photos and realtime sync, provider-initiated push,
# member invoice list, provider availability toggle, and all the wave-1 items
# (back button, session feedback, successful-only ledger, username suggestions,
# durationWords, no-expiry statement). versionCode 10200 is already installed on
# the test device (hand-passed for 1.1.19), so this build is passed -PversionCode=10201.
# 1.2.2 (2026-09-17) is the call-defects release, against seventeen issues Amit
# reported from real-device testing. The two that hid the rest: tapping Answer or
# Decline on a call notification CRASHED the process (reactNativeHost's getter
# throws under the New Architecture, and the ?. sat on the cast), and
# send-open-alert had no import statements at all, so every Notify tap had thrown
# ReferenceError server-side since the file was created. Then, from the reference app's
# VoIPService rather than by guesswork: the ring is no longer started after the
# app takes MODE_IN_COMMUNICATION, which routed it away inaudibly, and the two
# competing incoming-call notifications became one that carries the full-screen
# intent and IS the foreground service's. Plus member faces on the call screen
# (a clay: sentinel was reaching <Image> as a uri), availability as a master
# switch over the three channels, and presence retired in its favour.
#
# versionCode is passed explicitly as 10203: 10202 is already on the alpha track,
# and the derivation from this name would collide with it.
# 1.3.0 (2026-09-24): switch to video in-call with consent, billing only the
# difference (132-142); Truecaller opens straight from the bloom, with Google
# as its footer's alternative and phone codes off; profiles no longer client-
# insertable or deletable (133); notices on one app-wide overlay. Passed
# -PversionCode=10300, the code an internal 1.3.0 build derives, so neither
# track's install blocks the other's update. Alpha held 10211 (1.2.2) that day.
# 1.4.0 (2026-09-27): native navigation (react-navigation native-stack + the
# Bluesky bottom bar, re-tap to top, the chat header's full-page profile);
# stories (photo/video, comments, reactions); WhatsApp-style presence and last
# seen (155); the busy "wait ~N m" (154); the contact guard in shadow (156-159);
# the provider IA and Edit profile (180); the Astrotalk-anatomy provider card;
# Bluesky type, tabs and chips; one coral ramp; Phosphor icons. Derives 10400.
# 1.4.1 (2026-10-03): chat billing deferred to the provider's first reply
# (181); presence push (182); unread counters recount on read (183); session
# start asked at send time; WhatsApp-style transcript and charcoal dark mode;
# press feedback on the visible shape; Sentry environments and funnel logs.
# Derives 10401.
# 1.4.2 (2026-10-03): a backgrounded call always rings (CallStyle or a
# heads-up when the full-screen grant is gone), round caller photo that the
# service ring keeps, 30 s ring; private names in pushes; Bluesky Settings,
# About and back arrow; single-page sheets close with X; the provider's own
# story avatar and Online/Offline; badge anchored in landscape. Derives 10402.
# 1.4.3 (2026-10-03): landscape wallpaper and call face; a new session request
# clears a stale review sheet. Derives 10403.
# 1.4.4 (2026-10-03): a call that just ended jumps the chat to its row.
# Derives 10404.
# 1.4.5 (2026-10-07): provider onboarding takes at least three real photos
# (migration 185 enforces it server-side). Derives 10405.
# 1.4.6 (2026-10-10): provider sweep — agreement step, gender, onboarding
# resumes through the policy gate, provider chat and requests fixes, earnings
# split, admin tools. Needs migrations 186-191 (live). Derives 10406.
# 1.4.7 (2026-10-11): labelled bottom bar in WhatsApp's colour recipe, coral
# re-tuned in OKLCH, bold Phosphor icons, flower listener mark, and the 1.4.6
# review fixes. Derives 10407.
VERSION_NAME=1.4.7

# --- Build speed (added 2026-08-26) ---------------------------------------
# Measured, not cargo-culted. The daemon is on by default; these three are the
# free wins for a multi-module project (:app + :baselineprofile).
#
# parallel: build independent modules concurrently.
# caching: reuse task outputs across builds — the big one for incremental work.
# configureondemand: skip configuring modules a task does not touch.
# configuration-cache: reuse the configured task graph itself. Measured on this
# build with Gradle 9.3.1: `help` 9s -> 1s and `assembleDebug --dry-run` 4s ->
# 0.96s on the second invocation, with strict problem handling and no warnings.
# https://docs.gradle.org/current/userguide/configuration_cache_enabling.html
#
# NOT here: nothing that changes output bytes. These only change how the build
# is scheduled, so a cached debug build and a clean release build are identical.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# react-native-video (stories). A story is one progressive MP4 behind a signed
# URL (144 allows only video/mp4), so the adaptive-streaming Media3 modules are
# dead weight: DASH, HLS and SmoothStreaming off, IMA and RTSP stay off.
# Read by node_modules/react-native-video/android/build.gradle (safeExtGet).
RNVideo_useExoplayerDash=false
RNVideo_useExoplayerHls=false
RNVideo_useExoplayerSmoothStreaming=false
RNVideo_useExoplayerIMA=false
RNVideo_useExoplayerRtsp=false

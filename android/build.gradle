buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        /*
         * Baseline Profile generation.
         * https://developer.android.com/topic/performance/baselineprofiles/create-baselineprofile
         *
         * Version pinned rather than inherited: the plugin declares a supported
         * AGP range per release, and 1.4.1 covers [8.0.0, 9.0.0), which is where
         * this project sits.
         */
        classpath("androidx.benchmark:benchmark-baseline-profile-gradle-plugin:1.4.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Reads android/app/google-services.json and generates the resources
        // Firebase reads at init. Without it, messaging() throws "No Firebase App
        // '[DEFAULT]' has been created" at the first call and nowhere earlier.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

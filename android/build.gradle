buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        // PBL 9.1.0 ships Kotlin 2.3 metadata; the app compiler must be able to
        // read it. Kotlin 2.3.0 supports this project's Gradle version.
        // https://developer.android.com/google/play/billing/release-notes
        // https://kotlinlang.org/docs/whatsnew23.html
        kotlinVersion = "2.3.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        /*
         * Baseline Profile generation.
         * https://developer.android.com/topic/performance/baselineprofiles/create-baselineprofile
         *
         * Version pinned rather than inherited: the plugin declares a supported
         * AGP range per release, and 1.4.1 covers [8.0.0, 9.0.0), which is where
         * this project sits.
         */
        classpath("androidx.benchmark:benchmark-baseline-profile-gradle-plugin:1.4.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        // Reads android/app/google-services.json and generates the resources
        // Firebase reads at init. Without it, messaging() throws "No Firebase App
        // '[DEFAULT]' has been created" at the first call and nowhere earlier.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

/*
 * Cashfree's Verification Suite SDK (com.cashfree.vrs:kyc-verification) is
 * published ONLY to Cashfree's own Maven repo — it 404s on Maven Central, unlike
 * the PG SDK (com.cashfree.pg:api, pulled by react-native-cashfree-pg-sdk from
 * Central). The 1-Click Onboarding native SDK needs this repo.
 * https://www.cashfree.com/docs/api-reference/vrs/v2/1-click-onboarding/1-click-onboarding-sdk#android-native
 *
 * content { includeGroupByRegex } is required: without it Gradle probes this
 * host for every AndroidX / Google artifact too. When Cashfree is slow or
 * unreachable the whole bundleRelease hangs or fails with dozens of
 * "Could not HEAD …/androidx/… Read timed out" errors (seen 2026-09-20 on
 * versionCode 10207). Restricting to Cashfree groups keeps Google/Maven
 * Central as the sole source for everything else.
 * https://docs.gradle.org/current/userguide/declaring_repositories_adv.html#sec:repository-content-filtering
 *
 * A project-level repositories block is safe here: react-native-cashfree-pg-sdk
 * already declares its own, so RepositoriesMode.FAIL_ON_PROJECT_REPOS is off.
 */
allprojects {
    repositories {
        maven {
            url "https://maven.cashfree.com/release"
            content {
                includeGroupByRegex("com\\.cashfree(\\..+)?")
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"

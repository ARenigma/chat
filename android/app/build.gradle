apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply plugin: "androidx.baselineprofile"

/*
 * react-native-agora declares the optional screen-sharing artifact as a runtime
 * dependency. Calls here publish camera tracks only, so retaining it would add
 * a MediaProjection activity/service and Android 14 foreground-service
 * permission for a feature the product does not expose.
 * https://developer.android.com/about/versions/14/changes/fgs-types-required#media-projection
 */
configurations.configureEach {
    exclude group: "io.agora.rtc", module: "full-screen-sharing"
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //
    // Empty on purpose for go-live QA: an empty list means EVERY variant
    // (including debug) embeds `index.android.bundle`. Debug-without-bundle
    // requires Metro + `adb reverse tcp:8081`, and that pipe drops after
    // Maestro clearState / shell churn — which is the "Unable to load script"
    // redbox that blocked Cashfree and Macrobenchmark for hours.
    // Hot reload: pass `-PmetroHotReload` to gradle (scripts/dev-device.sh does)
    // to build a debug variant WITHOUT an embedded bundle, served by Metro over
    // `adb reverse tcp:8081`. The default stays [] so every unflagged build,
    // including QA and Maestro, keeps working with no dev server. Verified
    // 2026-09-02: a debug APK built with the default silently ran its embedded
    // (stale) bundle for a whole session while Metro served the current code;
    // the flag makes the choice explicit and the test below pins the default.
    // https://reactnative.dev/docs/signed-apk-android#enable-proguard-to-reduce-the-size-of-the-apk-optional
    debuggableVariants = project.hasProperty("metroHotReload") ? ["debug"] : []

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Release signing is read from `android/keystore.properties`, which is
 * git-ignored. When that file is absent (CI typechecks, a contributor's clone)
 * the release build still assembles, unsigned, instead of failing, so build
 * verification never depends on holding the upload key.
 * See keystore.properties.example.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Build number for versionCode.
 *
 * Computed here rather than inline in defaultConfig: Groovy parses
 * `versionCode (expr).toInteger()` as a method call whose argument is evaluated
 * in a way AGP rejects with a bare "Value is null", which is a miserable error to
 * diagnose from. A local avoids the ambiguity entirely.
 *
 * A release build now REFUSES to fall back to 1, and that guard exists because
 * the old behaviour was a trap with a delayed trigger. Play only cares that
 * versionCode strictly increases, so the first upload of `1` succeeds and looks
 * fine, and then every subsequent local build is also `1` and is rejected at
 * upload, long after anyone remembers why. The failure lands on the person
 * shipping an update, not the person who set this up.
 *
 * Debug keeps the fallback: those builds are never uploaded and a version code
 * would be noise on every `run-android`.
 *
 * Supply it either way:
 *     CI_PIPELINE_IID=7 npm run android:bundle     (what CI does)
 *     ./gradlew bundleRelease -PversionCode=7      (by hand)
 */
def wantsRelease = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
def wantsInternal = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("internal")
}
def wantsClosedTest = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("closedtest")
}
def explicitVersionCode = System.getenv("CI_PIPELINE_IID") ?: project.findProperty("versionCode")

if ((wantsRelease || wantsClosedTest) && explicitVersionCode == null) {
    throw new GradleException(
        "A Play build needs an explicit versionCode.\n\n" +
        "  Play rejects a duplicate versionCode, and the old default of 1 meant\n" +
        "  every local release build collided with the first upload.\n\n" +
        "  Pass one:\n" +
        "    CI_PIPELINE_IID=<n> npm run android:bundle\n" +
        "    ./gradlew bundleRelease -PversionCode=<n>\n" +
        "    ./gradlew bundleClosedTest -PversionCode=<n>\n\n" +
        "  It must be higher than the highest already uploaded to Play."
    )
}

/**
 * The version users see. Required, because a build with no version is not a
 * release candidate and a default here would hide a missing property.
 */
def versionNameProperty = project.findProperty("VERSION_NAME")
if (versionNameProperty == null || !(versionNameProperty ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException(
        "VERSION_NAME must be set in android/gradle.properties as MAJOR.MINOR.PATCH.\n" +
        "  Found: ${versionNameProperty}"
    )
}

/**
 * Internal builds derive their versionCode from the version name.
 *
 * The App Distribution update prompt only fires when the *code* increases, so a
 * tester on a fixed versionCode would never be offered anything no matter how
 * many builds we pushed. Deriving it means bumping VERSION_NAME is enough, with
 * nothing else to remember and no counter file to drift out of step.
 *
 * 1.0.1 -> 10001, 1.2.3 -> 10203. Monotonic with semver as long as minor and
 * patch stay under 100, which is a limit worth having: a 100th patch on one
 * minor version is a signal, not a version number.
 *
 * Release builds are deliberately NOT derived. Play needs a code that strictly
 * increases across everything ever uploaded, and CI's pipeline number is the
 * only thing that actually guarantees that.
 */
def derivedInternalCode = {
    def parts = (versionNameProperty as String).tokenize('.').collect { it as Integer }
    parts[0] * 10000 + parts[1] * 100 + parts[2]
}()

def ciBuildNumber = (explicitVersionCode ?: (wantsInternal ? derivedInternalCode : "1")) as Integer

// Sentry Gradle integration: SHIPPED-build only, static path. It uploads JS
// source maps + Debug IDs so a crash in a build that reaches users symbolicates.
// Both the production release AND the closedTest (alpha) track are user-facing —
// alpha is the track testers run — so both get source maps. Debug is served
// readable JS by Metro and needs no upload.
// Guarded because @sentry/react-native's sentry.gradle is not configuration-cache
// compatible (it registers copy/cleanup tasks holding script references), so
// applying it in ANY variant poisons the config-cache store and fails even
// assembleDebug. This project keeps config cache STRICT (gradle.properties,
// enforced by platform.test — problems must fail, never be masked to `warn`), so
// the ONLY builds that may apply Sentry are the shipped-build npm scripts
// (android:release / android:bundle / android:bundle:closed), which pass
// `--no-configuration-cache`; debug and internal skip Sentry and keep the
// strict, measured config cache intact. A static path is used because spawning
// node at configuration time is itself a config-cache violation. Reuses
// `wantsRelease`/`wantsClosedTest` from the versionCode block above.
if (wantsRelease || wantsClosedTest) {
    apply from: new File(rootProject.projectDir, "../node_modules/@sentry/react-native/sentry.gradle")
}
android {
    /**
     * Mount `assets/` from the repo root instead of keeping a second copy of the
     * fonts under android/app/src/main/assets.
     *
     * React Native resolves a bundled face by looking for `fonts/<PostScript
     * name>.ttf` in the APK's assets, and adding the repo's `assets` directory as
     * a source dir puts `assets/fonts/Urbanist-*.ttf` at exactly that path. The
     * alternative, copying the five .ttf files into the Android tree, means two
     * copies of a binary in git and a silent drift the day someone updates one.
     */
    sourceSets {
        main {
            assets.srcDirs += ['../../assets']
        }
    }

    /*
     * react-native-agora installs Agora's full Android SDK, including every
     * optional visual/audio processing extension. This call path uses none of
     * those extensions, so carrying them added roughly 40 MB of uncompressed
     * arm64 code to the APK. Agora explicitly supports excluding `*_extension`
     * libraries from React Native APK packaging.
     * https://docs.agora.io/en/realtime-media/video/build/optimize-and-operate/app-size-optimization/react-native
     */
    packagingOptions {
        exclude '**/libagora_*_extension.so'
    }

    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.companionchat"
    defaultConfig {
        applicationId "com.companionchat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Resolved above, where the release guard also lives. Debug builds fall
        // back to 1; a release build without an explicit number refuses to
        // build at all rather than producing a duplicate Play would reject.
        versionCode ciBuildNumber
        versionName versionNameProperty

        // Ship only English resources. The app's own strings are English; this
        // strips the 80+ locale strings that Play Services / Firebase / AndroidX
        // bundle, which are otherwise dead weight. Revisit when the UI is localised
        // (e.g. add "hi" for Hindi).
        resConfigs "en"

        // Native symbols for Play Console crash reports. Costs nothing at
        // runtime; the symbol file is stripped out of the delivered APKs.
        ndk {
            debugSymbolLevel "SYMBOL_TABLE"
        }

        // Capture gate — safe default: blocked everywhere unless the build
        // variant explicitly sets it to true. Only `internal` does so, to open
        // the runtime @example.test account check in WindowChromeModule.
        // https://developer.android.com/reference/android/view/WindowManager.LayoutParams#FLAG_SECURE
        buildConfigField "boolean", "ALLOW_DEV_CAPTURE", "false"
        // Internal automation may open isolated, unfinished routes. The default
        // is closed so no shipping variant acquires the capability by accident.
        buildConfigField "boolean", "ALLOW_BENCHMARK_ROUTES", "false"
        // The phone-code sign-in, for Supabase TEST numbers (fixed code, no SMS)
        // on devices with no Truecaller or Google account: cloud test devices.
        // Closed by default; only debug and `internal` open it, never a Play
        // build (release, closedTest), where phone codes stay off (2026-09-24).
        buildConfigField "boolean", "ALLOW_TEST_PHONE_LOGIN", "false"

        // https://developer.android.com/training/testing/instrumented-tests
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties["MYAPP_UPLOAD_STORE_FILE"])
                storePassword keystoreProperties["MYAPP_UPLOAD_STORE_PASSWORD"]
                keyAlias keystoreProperties["MYAPP_UPLOAD_KEY_ALIAS"]
                keyPassword keystoreProperties["MYAPP_UPLOAD_KEY_PASSWORD"]
            }
        }
    }
    buildTypes {
        /**
         * Screen capture is blocked per build type, not per app.
         *
         * `FLAG_SECURE` is the product's rule and it belongs in what users install.
         * It is also the reason nobody can look at the app while building it: a
         * secure window returns nothing to `screencap`, so on-device visual
         * verification stops working entirely, which is how three bugs reached a
         * device in this project already.
         *
         * Production blocks it. Debug, Firebase-founder `internal`, and Play
         * `closedTest` remain capturable for frame-by-frame defect reports.
         */
        debug {
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "BLOCK_SCREENSHOTS", "false"
            buildConfigField "boolean", "ALLOW_TEST_PHONE_LOGIN", "true"
        }
        release {
            // Never the debug key: an APK signed with the shared debug keystore
            // is trivially re-signable and Play rejects it.
            signingConfig hasReleaseKeystore ? signingConfigs.release : null
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField "boolean", "BLOCK_SCREENSHOTS", "true"
            // Explicit false even though defaultConfig already sets it: any
            // reader auditing capture policy must find the answer here without
            // tracing the inheritance chain.
            buildConfigField "boolean", "ALLOW_DEV_CAPTURE", "false"
            buildConfigField "boolean", "ALLOW_BENCHMARK_ROUTES", "false"
        }

        /**
         * Play closed-testing artifact.
         *
         * It is release-equivalent (R8, shrinking, upload signature and release
         * dependency graph) but deliberately leaves capture available so named
         * testers can attach screenshots and recordings to defect reports.
         * Never promote this artifact to production; production is bundleRelease.
         *
         * A separate build type is required because Play tracks do not expose a
         * trustworthy runtime API for "this account is a closed tester". Basing
         * capture policy on a remote flag would also reveal content before auth
         * and fail offline.
         * https://developer.android.com/security/fraud-prevention/activities
         */
        closedTest {
            initWith release
            matchingFallbacks = ["release"]
            signingConfig hasReleaseKeystore ? signingConfigs.release : null
            buildConfigField "boolean", "BLOCK_SCREENSHOTS", "false"
        }

        /**
         * What testers install, via Firebase App Distribution.
         *
         * `initWith release` rather than a hand-copied block, because the whole
         * point of a test build is that it is the release build. It inherits
         * minification, resource shrinking, the ProGuard rules and the upload
         * signing config, so a crash a tester hits is a crash that would have
         * shipped. A test build with minification off tests a different app.
         *
         * The one difference is the Firebase App Distribution SDK, added below
         * for this variant only. That SDK must never reach Play: Google ships it
         * as a beta artefact whose job is to sideload APKs, which is not
         * something a store build should be able to do.
         *
         * `matchingFallbacks` is not optional. Every AAR we depend on publishes
         * only `debug` and `release`, so without it AGP cannot resolve a variant
         * called `internal` and fails on the first library it reaches.
         *
         * No `applicationIdSuffix`. It is tempting, and it would break Google
         * sign-in: the OAuth redirect goes to the `companionchat://` scheme and
         * Supabase validates against a fixed redirect list, so a different
         * application id would only change which app cannot be signed into.
         */
        internal {
            initWith release
            matchingFallbacks = ["release"]
            signingConfig hasReleaseKeystore ? signingConfigs.release : null

            /*
             * The internal build is CAPTURABLE. Amit, 2026-09-06: "Allow all
             * screen recording, screen sharing and screen shot in app when
             * signed in by our dev accounts in internal build -- needed for
             * product demo."
             *
             * It was briefly tightened to block-by-default with a runtime
             * exemption for `@example.test` accounts, and that was wrong in
             * practice: that domain only matches the SEEDED fake providers from
             * scripts/seed-dev.sql, never the real account a demo is actually
             * given from. Verified on the S22 — every screencap came back a
             * solid black frame, so the carve-out blocked the exact thing it
             * existed to allow.
             *
             * ALLOW_DEV_CAPTURE stays as the second lever, which is what an
             * account-scoped policy would use later; today the VARIANT alone
             * decides, which is what was asked for.
             *
             * The trade, stated rather than hidden: a tester holding an internal
             * APK can capture a conversation with a real member. That was
             * already true before today, and it is exactly why the release
             * variant cannot do it under any circumstances.
             *
             * https://developer.android.com/reference/android/view/WindowManager.LayoutParams#FLAG_SECURE
             */
            buildConfigField "boolean", "BLOCK_SCREENSHOTS", "false"
            buildConfigField "boolean", "ALLOW_DEV_CAPTURE", "true"
            buildConfigField "boolean", "ALLOW_TEST_PHONE_LOGIN", "true"
            // This variant is the non-debuggable, minified benchmark target.
            // Release inherits false and repeats it explicitly above.
            buildConfigField "boolean", "ALLOW_BENCHMARK_ROUTES", "true"
        }
    }
}

/*
 * Application modules otherwise keep generated profiles per variant. The
 * recorder targets internal, but release is the Play artifact, so merge both
 * baseline-prof.txt and startup-prof.txt into the main source set consumed by
 * every optimized build.
 * https://developer.android.com/topic/performance/baselineprofiles/configure-baselineprofiles
 */
baselineProfile {
    mergeIntoMain = true
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    /**
     * Native Material 3 loading/progress indicators.
     *
     * The app used to approximate both widgets with bordered React Native Views.
     * That cannot reproduce Material's shape-morph loader or its circular
     * indeterminate sweep. 1.14 is the first stable MDC release carrying the
     * expressive LoadingIndicator and keeps the implementation on Android's
     * rendering/animator path, including the system animator-duration scale.
     *
     * https://github.com/material-components/material-components-android/blob/master/docs/components/LoadingIndicator.md
     * https://developer.android.com/reference/com/google/android/material/progressindicator/CircularProgressIndicator
     */
    implementation("com.google.android.material:material:1.14.0")

    /**
     * Google Play Billing Library 9.1 — required for User Choice Billing (UCB).
     *
     * UCB is the Play Billing Programme for India that lets users pay via
     * Google Play or an alternative billing system (Cashfree). Both options
     * must be shown simultaneously, above the fold, with equal visual weight.
     * This is a contractual requirement, not a suggestion.
     *
     * billing-ktx 9.1 requires Kotlin ≥ 2.2.10 (silently — Kotlin 2.1.x
     * causes a metadata resolution error that does not mention billing).
     * The version is pinned in android/build.gradle.
     *
     * BILLING permission is auto-embedded by billing-ktx; do NOT add it
     * to the manifest.
     *
     * doc: developer.android.com/google/play/billing/integrate
     * doc: developer.android.com/google/play/billing/user-choice-billing
     */
    implementation("com.android.billingclient:billing-ktx:9.1.0")

    /**
     * Google Play in-app updates.
     *
     * This has to ship in the FIRST release or it is useless for the first
     * update: the prompt runs inside the version the user already has, so a
     * 1.0.0 without it can never offer 1.0.1 in-app. Play's own background
     * auto-update still happens either way; this is what makes it promptable.
     *
     * No -ktx variant: the module is small and the Task API reads fine without
     * the coroutine extensions, which would pull in a second dependency for two
     * call sites.
     */
    implementation("com.google.android.play:app-update:2.1.0")

    /**
     * Sign in with Google, in an app-owned bottom sheet.
     *
     * Credential Manager is the platform API Google now requires for this; the
     * old GoogleSignInClient is deprecated and the browser redirect it replaced
     * is the only step that used to take a user out of the onboarding.
     *
     *   credentials                    the AndroidX API surface
     *   credentials-play-services-auth the Play services provider that actually
     *                                  renders the sheet. Without it every
     *                                  request fails with NoCredentialException
     *                                  on a device that plainly has accounts.
     *   googleid                       GetGoogleIdOption and the token type
     *
     * No coroutines dependency is declared: `getCredential` is a suspend
     * function, and kotlinx-coroutines already arrives transitively through
     * androidx.credentials. Declaring it again would risk pinning a version
     * against the one the AndroidX artifact expects.
     */
    /*
     * Baseline Profile: the generated profile, plus the installer that applies it.
     * https://developer.android.com/topic/performance/baselineprofiles/overview
     *
     * `profileinstaller` is not optional here and is the part most easily
     * missed. A baseline profile baked into an APK is applied automatically only
     * when Play installs it. Every build a tester sideloads from App
     * Distribution, and every `adb install`, needs this library to write the
     * profile into ART at first run — without it the whole exercise measures
     * nothing outside Play.
     */
    implementation("androidx.profileinstaller:profileinstaller:1.4.1")
    baselineProfile(project(":baselineprofile"))

    implementation("androidx.credentials:credentials:1.3.0")
    implementation("androidx.credentials:credentials-play-services-auth:1.3.0")
    implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")

    /**
     * Cashfree 1-Click Onboarding (Verification Suite) SDK.
     *
     * Provider payout setup: a provider consents once (mobile OTP) and Cashfree
     * returns a verified PAN + bank account, so we never collect or store raw KYC
     * — the auth_code is exchanged server-side. This is the vendor's own SDK
     * (RULE 1: prefer the platform's solution over a hand-rolled webview); under
     * the hood it renders a Cashfree-owned WebView bottom sheet we do not maintain.
     *
     * CFException (thrown by CFVerificationService.build) comes from
     * com.cashfree.pg:base, already on the classpath transitively via
     * react-native-cashfree-pg-sdk → com.cashfree.pg:api:2.4.0, so it is not
     * re-declared here. Repo is added in android/build.gradle (Central 404s it).
     * https://www.cashfree.com/docs/api-reference/vrs/v2/1-click-onboarding/1-click-onboarding-sdk#android-native
     */
    implementation("com.cashfree.vrs:kyc-verification:1.0.1")

    /**
     * Truecaller OAuth SDK 3.3.0 — phone-verified 1-tap onboarding.
     *
     * RULE 1: prefer the platform's own solution. The SDK ships a consent sheet
     * in Truecaller's own process, not a webview we maintain, and returns an
     * authorization code + PKCE verifier that the server exchanges for a
     * verified phone number without any credential transiting JS.
     *
     * Available on Maven Central. mavenCentral() is already in the project-level
     * repositories block. No missed-call or READ_PHONE_STATE/READ_CALL_LOG
     * permissions are requested; OPTION_VERIFY_ONLY_TC_USERS limits the flow to
     * existing Truecaller users, keeping the permission surface unchanged.
     *
     * https://docs.truecaller.com/truecaller-sdk/android/latest-oauth-sdk-3.3.0/integration-steps/setup
     * https://central.sonatype.com/artifact/com.truecaller.android.sdk/truecaller-sdk/3.3.0
     */
    implementation("com.truecaller.android.sdk:truecaller-sdk:3.3.0")

    /**
     * CameraX 1.4.0 — live-preview native view (PappalCameraPreview).
     *
     * RULE 1: prefer the platform's own solution. CameraX is Google's official
     * camera API for Android; hand-rolling Camera2 directly would require
     * duplicating the lifecycle management, surface negotiation, and rotation
     * correction that CameraX already provides.
     *
     * RULE 5: four artifacts rather than one. Each has a distinct function:
     *   camera-core      the use-case API surface (Preview, etc.)
     *   camera-camera2   the Camera2 backend that camera-core delegates to
     *   camera-lifecycle ProcessCameraProvider / LifecycleOwner binding
     *   camera-view      PreviewView — the only surface that supports COMPATIBLE
     *                    (TextureView) mode, required for rounded-corner tiles
     *
     * All four are pinned at the same 1.4.0 stable revision so their
     * inter-artifact ABIs match. Mixing versions silently breaks the surface
     * negotiation between camera-core and camera-camera2.
     *
     * NOT an npm dependency (CLAUDE.md RULE 5): this is a platform-layer
     * camera API, not a JavaScript library. It lives here, not in package.json.
     *
     * https://developer.android.com/training/camerax/preview
     * https://developer.android.com/reference/androidx/camera/view/PreviewView.ImplementationMode
     */
    implementation("androidx.camera:camera-core:1.4.0")
    implementation("androidx.camera:camera-camera2:1.4.0")
    implementation("androidx.camera:camera-lifecycle:1.4.0")
    implementation("androidx.camera:camera-view:1.4.0")
    /*
     * ListenableFuture, which CameraTilePackage.kt compiles against
     * (ProcessCameraProvider.getInstance). CameraX publishes it as
     * `com.google.guava:listenablefuture:1.0`; react-native-video's Media3
     * depends on full Guava, whose Gradle metadata upgrades that artifact to
     * the EMPTY `9999.0-empty-to-avoid-conflict-with-guava`, leaving the class
     * only in Guava, which Media3 does not expose to this module. Declaring
     * the same Guava Media3 1.8.0 already ships (33.3.1-android, from its POM)
     * puts the class back on the compile classpath and adds nothing to the
     * APK: it is already on the runtime classpath.
     * https://github.com/google/guava/wiki/UseGuavaInYourBuild
     */
    implementation("com.google.guava:guava:33.3.1-android")

    // Core-Telecom self-managed calling API (developer.android.com/develop/connectivity/telecom/self-managed)
    implementation("androidx.core:core-telecom:1.0.0")
    // ServiceCompat.startForeground() with type mask — requires 1.12+ (developer.android.com/develop/background-work/services/foreground-services)
    implementation("androidx.core:core:1.12.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Instrumented ActivityScenario lifecycle tier.
    // https://developer.android.com/guide/components/activities/testing
    androidTestImplementation("androidx.test:core:1.6.1")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test:runner:1.6.2")
}

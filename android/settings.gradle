pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins {
    id("com.facebook.react.settings")
    // `updateDaemonJvm` emits portable download URLs only when a resolver is
    // configured. Keep every IDE and CLI build on the AGP-supported JDK 17.
    // https://docs.gradle.org/current/userguide/toolchains.html#sub:download_repositories
    id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }

rootProject.name = 'CompanionChat'
include ':app'
include ':baselineprofile'
includeBuild('../node_modules/@react-native/gradle-plugin')

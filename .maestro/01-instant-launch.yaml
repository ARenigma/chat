# CUJ 1 — first launch is one tap from a session, and shows the trade honestly.
#
# The identity model has changed twice; see ADR-0004. This journey asserts what
# is true of the current one: no form, two providers, and an explicit statement
# that signing in tells Google or Facebook you use this app.
#
# It deliberately stops at the consent screen. Driving Google's OAuth page from
# Maestro would be testing Google, would break whenever they change it, and is
# exactly the kind of brittle end-to-end nobody maintains. The half we own is
# "the buttons exist, are labelled correctly, and open the system browser".
appId: com.companionchat
name: First launch offers social sign-in and nothing else
---
- clearState
- launchApp:
    clearKeychain: true
    stopApp: true

- assertVisible:
    id: 'signin-google'
# Asserted absent, not merely unmentioned: the Facebook button existed with no
# credentials behind it, so every tap failed. A flow that stops naming it would
# pass again the moment someone re-added it.
- assertNotVisible:
    id: 'signin-facebook'
- assertVisible: 'to listen.'
- assertVisible: 'Not therapy'

# The disclosure is on the screen, not buried in a policy.
- assertVisible: 'does tell Google'

# No form of any kind, and no third path in.
- assertNotVisible: 'Password'
- assertNotVisible: 'Phone number'
- assertNotVisible: 'Email address'
- assertNotVisible: 'Continue as guest'

# No permission dialog, ever. These are the only strings Android can show.
- assertNotVisible: 'Allow'
- assertNotVisible: 'While using the app'
- assertNotVisible: 'Deny'

- takeScreenshot: artifacts/01-signin

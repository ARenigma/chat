# CUJ 1 — first launch lands on phone sign-in, and nothing else.
#
# This journey used to assert the opposite: a usable session on the first frame
# and *no* sign-in wall. Migration 006 traded that away deliberately (see
# ADR-0001 and src/api/auth.ts) because anonymous accounts made every safety
# control in 005 theatre — a banned user was back in ten seconds.
#
# What must still hold is that the wall is the *only* thing between the launcher
# and the app: two fields, no password, no email, no terms checkbox, and no
# runtime permission dialog.
appId: com.companionchat
name: First launch asks for a phone number and nothing else
---
- clearState
- launchApp:
    clearKeychain: true
    stopApp: true

- assertVisible:
    id: 'phone-input'
- assertVisible: 'to listen.'
- assertVisible: 'Not therapy'

# The number is used for sign-in and safety, and is never shown to a peer. That
# claim is on the screen because it is the first thing a reasonable person asks.
- assertVisible: 'never shown to anyone'

# No password, no email, no social buttons — phone and OTP is the whole of it.
- assertNotVisible: 'Password'
- assertNotVisible: 'Continue with Google'
- assertNotVisible: 'Continue with Facebook'
- assertNotVisible: 'Email'

# No permission dialog, ever. These are the only strings Android can show.
- assertNotVisible: 'Allow'
- assertNotVisible: 'While using the app'
- assertNotVisible: 'Deny'

# scripts/e2e.mjs seeds this as a Supabase test OTP number, so it never touches
# an SMS gateway and the code is fixed.
- tapOn:
    id: 'phone-input'
- inputText: '9999900001'
- tapOn:
    id: 'phone-submit'

- extendedWaitUntil:
    visible:
      id: 'otp-input'
    timeout: 20000
- assertVisible: 'Check your messages'

- tapOn:
    id: 'otp-input'
- inputText: '123456'
- tapOn:
    id: 'otp-submit'

# Signed in, and the inbox is home.
- extendedWaitUntil:
    visible: 'Your conversations'
    timeout: 30000
- assertVisible:
    id: 'token-badge'

- takeScreenshot: artifacts/01-signin

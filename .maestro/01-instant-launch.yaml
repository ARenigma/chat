# CUJ 1 — a cold boot presents the welcome, then the owned authentication UI.
#
# Maestro deliberately stops before Google or phone system UI. Those surfaces
# belong to their providers; this journey verifies the boundary Pappal owns.
appId: com.companionchat
name: First launch reaches supported sign-in
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true

- extendedWaitUntil:
    visible:
      id: 'welcome-continue'
    timeout: 15000
- assertVisible: 'Positive conversations, made simple.'
- assertNotVisible:
    id: 'onboard-google'
# LogBox chip used to cover this CTA and swallow taps; index.js ignores that
# banner in __DEV__. Tap the pressable by testID (stable) after bloom settle.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'welcome-continue'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'onboard-google'
    timeout: 15000
- assertVisible:
    id: 'onboard-google'
# 'onboard-truecaller' is not asserted: it only renders when the Truecaller app
# is installed and usable, and on such a phone the bloom opens the sheet
# directly. Google is the one control every device shows.
# Asserted absent, not merely unmentioned: the Facebook button existed with no
# credentials behind it, so every tap failed. A flow that stops naming it would
# pass again the moment someone re-added it.
- assertNotVisible:
    id: 'signin-facebook'
- assertNotVisible:
    id: 'signin-google'
- assertNotVisible: 'Password'
- assertNotVisible: 'Email address'
- assertNotVisible: 'Continue as guest'

# Permissions are requested only when a signed-in user invokes their feature.
- assertNotVisible: 'While using the app'

- takeScreenshot: artifacts/01-onboarding-auth

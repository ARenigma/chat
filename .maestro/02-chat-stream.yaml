# CUJ 2 — send a message and receive a streamed reply.
# Asserts the whole path: composer -> Edge Function -> atomic debit -> SSE ->
# persisted transcript. The reply text is exact because the upstream is
# scripts/openai-stub.mjs, not a live model.
appId: com.companionchat
name: Chat streams a reply and persists it
---
- launchApp
- tapOn:
    id: 'persona-nova'
- assertVisible:
    id: 'chat-title'
- assertVisible: 'Nova is listening.'

- copyTextFrom:
    id: 'token-count'
- evalScript: ${output.balanceBefore = maestro.copiedText}

- tapOn:
    id: 'composer-input'
- inputText: 'Rough day, I keep replaying the meeting.'
- tapOn:
    id: 'composer-send'

# The live reply renders outside the FlatList while streaming.
- assertVisible:
    id: 'streaming-bubble'

# On completion the streaming bubble is replaced by a persisted row.
- extendedWaitUntil:
    visible:
      id: 'bubble-assistant'
    timeout: 20000
- assertNotVisible:
    id: 'streaming-bubble'
- assertVisible: 'I hear you. That sounds genuinely tiring.'
- assertVisible: 'Rough day, I keep replaying the meeting.'

# One message costs exactly one token.
- copyTextFrom:
    id: 'token-count'
- evalScript: |
    const before = parseInt(output.balanceBefore, 10);
    const after = parseInt(maestro.copiedText, 10);
    if (after !== before - 1) {
      throw new Error(`token drift: ${before} -> ${after}, expected exactly -1`);
    }

# And it survives a relaunch, which proves the server wrote it.
- launchApp:
    stopApp: true
- assertVisible: 'I hear you. That sounds genuinely tiring.'

- takeScreenshot: artifacts/02-stream

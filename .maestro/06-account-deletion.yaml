# CUJ 5 — Play Store data deletion.
# The UI half. Proof of the cascade itself is SQL: scripts/e2e.mjs queries the
# local Supabase database afterwards and fails if a single row survived.
appId: com.companionchat
name: Delete account and all data
---
- launchApp
- tapOn:
    id: 'nav-settings'
- assertVisible: 'Account & Privacy'

# The claim on this screen has to be true; the SQL check in e2e.mjs is what proves it.
- assertVisible: 'advertising ID'

# The one exception to "nothing is retained", stated where it matters rather than
# buried in a policy: see the retention note in migration 005.
- scrollUntilVisible:
    element:
      id: 'delete-account'
    direction: DOWN
- tapOn:
    id: 'delete-account'
- assertVisible: 'Abuse reports'
- tapOn: 'Cancel'

- tapOn:
    id: 'delete-account'
- assertVisible: 'It cannot be undone.'
- tapOn:
    id: 'delete-confirm'

# Deletion signs out. Since this run never completed the real external identity
# flow, the retained first-run state correctly returns to the welcome surface.
# The provider is untouched; e2e.mjs asserts that in SQL.
- extendedWaitUntil:
    visible:
      id: 'welcome-continue'
    timeout: 30000
- assertNotVisible: 'Your conversations'
- assertNotVisible: 'Back online.'

- takeScreenshot: artifacts/06-deleted

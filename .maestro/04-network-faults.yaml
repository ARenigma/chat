# CUJ 4 — network fault injection.
# Connectivity is cut by scripts/e2e.mjs (adb svc wifi/data disable) immediately
# before this flow runs.
#
# The session ledger is server-authoritative. An unreachable server means no
# message or billing transaction can begin. The failure must be surfaced and the
# optimistic bubble withdrawn; scripts/e2e.mjs checks the wallet remains equal.
# scripts/e2e.mjs asserts the balance in SQL afterwards.
appId: com.companionchat
name: Offline send fails cleanly and spends nothing
---
- launchApp
- tapOn: 'Ada'
- tapOn:
    id: 'action-chat'

- tapOn:
    id: 'composer-input'
- inputText: 'Does this survive a dead connection?'
- tapOn:
    id: 'composer-send'

- extendedWaitUntil:
    visible:
      id: 'notice-bar'
    timeout: 30000
- assertVisible: 'Check your connection.'

# The optimistic bubble must be gone, not stranded in the transcript looking
# like a delivered message.
- assertNotVisible: 'Does this survive a dead connection?'

- takeScreenshot: artifacts/04-offline

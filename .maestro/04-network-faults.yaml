# CUJ 4 — network fault injection.
# Connectivity is cut by scripts/e2e.mjs (adb svc wifi/data disable) immediately
# before this flow runs.
#
# The invariant changed with the pivot, and in our favour. The Edge Function had
# to debit, call a model, then insert — three steps that could fail apart, so an
# offline send needed a *refund*. `send_message` debits and inserts in one
# transaction, so an unreachable server means the transaction never began and
# there is nothing to refund. What must hold now is stricter: the failure is
# surfaced, the optimistic bubble is withdrawn, and not one token moved.
# scripts/e2e.mjs asserts the balance in SQL afterwards.
appId: com.companionchat
name: Offline send fails cleanly and spends nothing
---
- launchApp
- tapOn: 'Ada'

- tapOn:
    id: 'composer-input'
- inputText: 'Does this survive a dead connection?'
- tapOn:
    id: 'composer-send'

- extendedWaitUntil:
    visible:
      id: 'notice-bar'
    timeout: 30000
- assertVisible: 'Check your connection.'

# The optimistic bubble must be gone, not stranded in the transcript looking
# like a delivered message.
- assertNotVisible: 'Does this survive a dead connection?'

- takeScreenshot: artifacts/04-offline

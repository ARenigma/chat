# CUJ 3 — the paid-session economy is visible and honest.
# The harness seeds a low wallet. A message sent while the bilateral request is
# pending must not debit it; Recharge remains available without interrupting chat.
appId: com.companionchat
name: Pending chat does not create a per-message debit
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: 'Ada'
    timeout: 20000
- tapOn: 'Ada'
- tapOn:
    id: 'action-chat'

# The seed balance is set to 3 by scripts/e2e.mjs.
- assertVisible:
    id: 'token-badge'
- assertVisible:
    id: 'token-count'
- assertVisible: '3'

- tapOn:
    id: 'composer-input'
- inputText: 'Still here.'
- tapOn:
    id: 'composer-send'
- extendedWaitUntil:
    visible: 'Still here.'
    timeout: 20000

# ADR-0020: pending messages do not decrement the authoritative wallet.
- assertVisible:
    id: 'token-count'
- assertVisible: '3'
- assertNotVisible:
    id: 'refill-sheet'

- tapOn:
    id: 'token-badge'
- assertVisible:
    id: 'recharge-wallet'
- tapOn:
    id: 'recharge-wallet-back'
- assertNotVisible:
    id: 'recharge-wallet'

- takeScreenshot: artifacts/03-tokens

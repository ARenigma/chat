# CUJ 3 — the token economy is visible and honest.
# Drains the wallet to the low-balance threshold, checks the badge flips to a
# nudge without interrupting the conversation, then claims a refill.
#
# A member pays on send, not on reply, so this journey needs nobody on the other
# end — which is why it survived the pivot unchanged in spirit.
appId: com.companionchat
name: Low balance nudges, never blocks
---
- launchApp
- tapOn: 'Ada'

# The seed balance is set to 3 by scripts/e2e.mjs before this flow, so two sends
# cross the threshold without needing 48 round trips.
- assertVisible:
    id: 'token-badge'
- assertVisible: '3 left'

- repeat:
    times: 2
    commands:
      - tapOn:
          id: 'composer-input'
      - inputText: 'Still here.'
      - tapOn:
          id: 'composer-send'
      - extendedWaitUntil:
          visible:
            id: 'read-receipt'
          timeout: 20000

# Under three tokens the badge becomes a pill. It is a nudge in place, not a
# modal: the sheet must not have opened by itself.
- assertVisible: '1 left'
- assertNotVisible:
    id: 'refill-sheet'

- tapOn:
    id: 'token-badge'
- assertVisible:
    id: 'refill-sheet'
- tapOn:
    id: 'refill-claim'
- assertNotVisible:
    id: 'refill-sheet'

- takeScreenshot: artifacts/03-tokens

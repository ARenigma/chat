# CUJ 3 — the paid-session economy is visible and honest.
# The harness seeds two minutes of chat credit. A message sent while the bilateral
# request is pending must not debit it, and the first successful member message
# opens the explicit recharge nudge.
appId: com.companionchat
name: Pending chat does not create a per-message debit
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: 'Ada'
    timeout: 20000
- tapOn: 'Ada'
- tapOn:
    id: 'action-chat'

# The seed balance is set to 44 by scripts/e2e.mjs.
- assertVisible:
    id: 'token-badge'
- assertVisible:
    id: 'token-count'
- assertVisible: '44'

- tapOn:
    id: 'chat-v2-input'
- inputText: 'Still here.'
- tapOn:
    id: 'chat-v2-send'
- extendedWaitUntil:
    visible: 'Still here.'
    timeout: 20000

# ADR-0020: pending messages do not decrement the authoritative wallet.
- assertVisible:
    id: 'token-count'
- assertVisible: '44'
- assertVisible:
    id: 'refill-sheet'

# Close the first-send sheet, then prove the wallet route remains independently
# reachable from the badge.
- tapOn: 'Dismiss'
- assertNotVisible:
    id: 'refill-sheet'
- tapOn:
    id: 'token-badge'
- assertVisible:
    id: 'recharge-wallet'
- tapOn:
    id: 'recharge-wallet-back'
- assertNotVisible:
    id: 'recharge-wallet'

- takeScreenshot: artifacts/03-tokens

# CUJ 2 — a session request is sent and survives a relaunch.
#
# This replaces the streamed-reply journey. There is no model to answer, and a
# single device cannot play both sides, so what is provable here is the half that
# belongs to the sender: the optimistic bubble is confirmed by the server, the
# bilateral chat request remains pending, and no per-message charge is implied.
#
# The other half — delivery, typing, presence, receipts — needs a second
# authenticated session driving the provider side. Tracked as a follow-up rather
# than faked with a stub, because a stub would prove nothing about Realtime.
appId: com.companionchat
name: Chat request is confirmed and persists
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: 'Ada'
    timeout: 20000
- tapOn: 'Ada'
- tapOn:
    id: 'action-chat'

- assertVisible:
    id: 'chat-v2-input'
- tapOn:
    id: 'chat-v2-input'
- inputText: 'Long day. Mind if I talk at you for a bit?'
- tapOn:
    id: 'chat-v2-send'

# Our own turn and the pending bilateral-session state.
- extendedWaitUntil:
    visible:
      id: 'chat-v2-message-mine'
    timeout: 20000
# Await banner removed: first-send flow no longer shows a status chip above the composer.

# Durability: the transcript is Postgres, not local state.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: 'Ada'
    timeout: 20000
- tapOn: 'Ada'
- tapOn:
    id: 'action-chat'
- extendedWaitUntil:
    visible: 'Long day. Mind if I talk at you for a bit?'
    timeout: 20000

- takeScreenshot: artifacts/02-send

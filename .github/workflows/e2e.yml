name: e2e

# Stage 3: real-device matrix. Only runs once ci.yml's gate is green, because
# booting four emulators to discover a type error is a waste of twenty minutes.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  pull_request:
    types: [labeled] # Attach the `e2e` label to run the matrix on a PR.
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: API ${{ matrix.api }} · ${{ matrix.profile }}
    if: >-
      github.event_name != 'pull_request' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android 11 is the floor worth testing (minSdk is 24, but the install
          # base below 11 is negligible); 16 is the compile/target SDK.
          - api: 30
            profile: pixel_2 # Low DPI, 1080x1920
            android: '11'
          - api: 33
            profile: pixel_4
            android: '13'
          - api: 34
            profile: pixel_6
            android: '14'
          - api: 36
            profile: pixel_8_pro # High DPI, forced edge-to-edge
            android: '16'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: npm ci

      - name: install maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # KVM is what makes an emulator usable rather than glacial on a runner.
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: gradle and AVD cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ~/.gradle/caches
          key: e2e-${{ matrix.api }}-${{ hashFiles('android/**/*.gradle', 'package-lock.json') }}

      - name: run the critical user journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disk-size: 8G
          # -no-snapshot-save keeps a failed run from poisoning the AVD cache.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save -camera-back none
          disable-animations: true
          script: node scripts/e2e.mjs --install

      - name: collect artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api${{ matrix.api }}
          path: |
            artifacts/**
            ~/.maestro/tests/**
          retention-days: 14
          if-no-files-found: warn

  gate:
    name: stage 3 gate
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - run: echo "every critical user journey passed on every device in the matrix"

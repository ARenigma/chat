name: release

# Stage 4: production deploy and staged rollout.
#
# Ordering is deliberate. The Edge Function ships *before* the app, because a new
# client calling an old function is a broken client, whereas an old client calling
# the new function is fine — the wire contract in
# supabase/functions/_shared/protocol.ts is additive and the client ignores
# unknown SSE events.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      rollout:
        description: Initial rollout fraction for the beta track
        default: '0.1'
        required: false

concurrency:
  group: release
  cancel-in-progress: false # Never interrupt a half-finished rollout.

permissions:
  contents: read

jobs:
  # Re-run every gate against the exact tagged commit. A green run on the branch
  # tip is not evidence about the tag.
  gates:
    name: re-run stages 1 and 2
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  edge:
    name: deploy edge functions
    needs: gates
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase db push --include-all

      - name: deploy stream-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy stream-chat --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: smoke test the deployed function
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FUNCTIONS_URL: ${{ secrets.SUPABASE_URL }}/functions/v1
        run: |
          set -euo pipefail
          # No Authorization header, so 401 is the correct answer. A 404 means the
          # deploy silently did not take; a 500 means the secrets are missing.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$FUNCTIONS_URL/stream-chat" \
            -H "apikey: $ANON_KEY" -H 'content-type: application/json' -d '{}')
          echo "unauthenticated POST returned $code"
          test "$code" = "401"

  play:
    name: upload to play
    needs: edge
    runs-on: ubuntu-latest
    environment: production
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: npm ci

      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "release=com.companionchat@${VERSION}+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: write .env and signing material
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          APP_ENV=production
          EOF
          echo "$KEYSTORE" | base64 -d > android/app/upload.keystore
          cat > android/keystore.properties <<EOF
          MYAPP_UPLOAD_STORE_FILE=upload.keystore
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: build signed bundle
        run: ./gradlew bundleRelease --no-daemon
        working-directory: android

      - name: compliance gates on the artefact that ships
        run: |
          npm run verify:manifest
          npm run android:release
          npm run verify:hermes

      - name: assert the bundle is signed with the upload key
        run: |
          set -euo pipefail
          unzip -l android/app/build/outputs/bundle/release/app-release.aab \
            | grep -qE 'META-INF/.*\.RSA' || { echo '::error::AAB is unsigned'; exit 1; }
          echo "AAB carries a signature block"

      - name: service account
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          echo "PLAY_SERVICE_ACCOUNT_JSON_PATH=$RUNNER_TEMP/play.json" >> "$GITHUB_ENV"

      - name: internal app sharing
        run: bundle exec fastlane android internal

      - name: staged closed beta
        run: bundle exec fastlane android beta rollout:${{ inputs.rollout || '0.1' }}

      - name: shred credentials
        if: always()
        run: |
          rm -f android/keystore.properties android/app/upload.keystore .env
          rm -f "$RUNNER_TEMP/play.json"

  health:
    name: release health monitor
    needs: play
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: watch crash-free rate
        id: watch
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ needs.play.outputs.release }}
        run: node scripts/ci-release-health.mjs --threshold=99.8 --window=2h --min-sessions=50 --wait=30

      - name: halt the rollout
        if: steps.watch.outcome == 'failure'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          export PLAY_SERVICE_ACCOUNT_JSON_PATH="$RUNNER_TEMP/play.json"
          bundle exec fastlane android halt_rollout track:beta
          rm -f "$RUNNER_TEMP/play.json"
          echo "::error::rollout halted — crash-free rate below 99.8%"
          exit 1

      - name: widen the rollout
        if: steps.watch.outcome == 'success'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          export PLAY_SERVICE_ACCOUNT_JSON_PATH="$RUNNER_TEMP/play.json"
          bundle exec fastlane android widen track:beta rollout:0.5
          rm -f "$RUNNER_TEMP/play.json"
